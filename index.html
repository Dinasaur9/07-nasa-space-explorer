<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>NASA Space Explorer</title>
  <!-- Browser tab icon: the official NASA logo (PNG with a see-through background) -->
  <link rel="icon" type="image/png" href="img/favicon.png" />
  <!-- NASA Horizon Design System fonts: Inter (headings), Public Sans (body), DM Mono (numbers & labels) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Public+Sans:wght@400;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link href="style.css" rel="stylesheet" type="text/css" />

  <!-- PWA: the web app manifest (name, icons, standalone display) -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#061f4a" />
  <!-- PWA on iPhone: home-screen icon and full-screen mode -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Space Explorer" />
</head>
<body>
  <!-- PWA: offline indicator (shown by js/pwa.js when the connection drops) -->
  <div id="offlineBanner" class="offline-banner" role="status" hidden>
    📡 You're offline. Showing saved space photos.
  </div>

  <div class="container">
    <header class="site-header">
      <img src="img/nasa-worm-logo.png" alt="NASA Logo" class="logo" />
      <h1>Space Explorer</h1>
    </header>

    <!-- PWA: custom install banner (shown when the browser says the app can be installed) -->
    <div id="installBanner" class="install-banner" hidden>
      <img src="icons/icon-192.png" alt="" class="install-icon" />
      <div class="install-text">
        <p class="install-title">Install Space Explorer</p>
        <p class="install-subtitle">Add it to your home screen and explore the cosmos offline.</p>
      </div>
      <div class="install-actions">
        <button id="installBtn" class="install-btn">Install</button>
        <button id="installDismiss" class="install-dismiss" aria-label="Not now">Not now</button>
      </div>
    </div>

    <!-- PWA: iPhone tip (Safari has no install event, so we explain the steps) -->
    <p id="iosInstallHint" class="ios-hint" hidden>
      📲 To install: tap the Share button, then <strong>Add to Home Screen</strong>.
    </p>

    <!-- LevelUp: Random space fact -->
    <section class="fact-box" aria-live="polite">
      <p class="fact-label">Did You Know?</p>
      <p id="factText" class="fact-text"></p>
    </section>

    <div class="filters">
      <input type="date" id="startDate" aria-label="Start date" />
      <input type="date" id="endDate" aria-label="End date" />
      <button id="getImagesBtn">Get Space Images</button>
      <!-- PWA: notification permission (hidden if the browser doesn't support notifications) -->
      <button id="notifyBtn" class="notify-btn" hidden>🔔 Enable Notifications</button>
    </div>

    <div id="gallery" class="gallery">
      <div class="placeholder">
        <div class="placeholder-icon">🔭</div>
        <p>Select a date range and click "Get Space Images" to explore the cosmos!</p>
      </div>
    </div>
  </div>

  <!-- Modal window (hidden until a gallery item is clicked) -->
  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-box">
      <button id="modalClose" class="modal-close" aria-label="Close">&times;</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
